services:
  - type: web
    name: devmind-ai-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_OPTIONS
        value: "--expose-gc --max-old-space-size=256"
      - key: EMBEDDING_BATCH_SIZE
        value: "2"
      - key: CODEBASE_EMBEDDING_BATCH_SIZE
        value: "4"
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"
      - key: LLM_PROVIDER
        value: gemini
